name: Pkg PR New

on:
  pull_request:
    branches: [main, dev]

jobs:
  pkg-pr-new:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run build

      - run: npx pkg-pr-new publish ./packages/sanity-plugin-atlas
